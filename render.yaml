services:
  - type: web
    name: my-ai-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional: several keys from DIFFERENT projects double the quota.
      # - key: GEMINI_API_KEYS
      #   sync: false
      # WEBHOOK_SECRET is generated by the app when not set.
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: ALLOWED_USERS
        value: ""
      - key: MAX_HISTORY_MESSAGES
        value: "20"
      - key: AI_MAX_RETRIES
        value: "3"
      - key: AI_RATE_LIMIT_RETRIES
        value: "4"
      - key: AI_RATE_LIMIT_MAX_WAIT
        value: "60"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "2048"
      # Optional fallback provider (free tier, no card needed):
      # https://console.groq.com/keys
      - key: GROQ_API_KEY
        sync: false
