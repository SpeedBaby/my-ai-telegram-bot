services:
  - type: web
    name: my-ai-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # WEBHOOK_SECRET не задаём: приложение сгенерирует безопасный само.
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.0-flash
      - key: ALLOWED_USERS
        value: ""
      - key: MAX_HISTORY_MESSAGES
        value: "20"
      - key: AI_MAX_RETRIES
        value: "3"
